name: Feature Request
description: Suggest an idea or enhancement for Stripe Payment
labels: ["feature-request"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Stripe Payment issue tracker! Before creating an issue, please heed the following:

        1. This tracker should only be used to report bugs and request features / enhancements to Stripe Payment
            - For questions and general support, use the [forum](https://discuss.frappe.io/)
        2. Please search existing issues before opening a new one. Duplicates will be closed and directed to the original discussion.
        3. Make your request as detailed as possible. The better you convey your message, the greater the drive to make it happen.

        We can't work on every request. Priorities are guided by the product goals of the app.

  - type: textarea
    id: problem-info
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution-info
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives-info
    attributes:
      label: Describe the alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or examples about the feature request here.
